# =============================================================
# keep-alive.yml
#
# WHERE THIS FILE GOES (this part matters — GitHub only recognizes
# workflows in this exact folder):
#
#   your-project-root/
#     └── .github/
#           └── workflows/
#                 └── keep-alive.yml   <-- this file, exactly here
#
# You'll likely need to create the ".github" and "workflows" folders
# yourself — they don't exist in your project yet. Instructions for
# how to do that are in the message below this file.
